[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dls-va-ioc-sim"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
description = "Simple framework for simulating vacuum IOCs"
dependencies = [
    "softioc",        # the records, the dispatcher and the IOC shell
    "epicsdbbuilder", # dbdump writes the recordset out without loading it
]
dynamic = ["version"]
license.file = "LICENSE"
readme = "README.md"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "copier",
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "tox-uv",
    "types-mock",
]

[project.scripts]
dls-va-ioc-sim = "dls_va_ioc_sim.__main__:main"

[project.urls]
GitHub = "https://github.com/DiamondLightSource/dls-va-ioc-sim"

[[project.authors]] # Further authors may be added by duplicating this section
email = "lee.hudson@diamond.ac.uk"
name = "Lee Hudson"

[tool.setuptools_scm]
version_file = "src/dls_va_ioc_sim/_version.py"

[tool.pyright]
# The copier answer was strict, and strict is unreachable while softioc ships
# no type information: of the 2848 errors it gives, 2588 are reportUnknown*
# cascading off untyped builder.aIn/aOut/mbbOut calls, which annotating this
# code cannot fix.  Standard is clean.  Put this back to "strict" if softioc
# ever grows stubs, or if someone writes them.
typeCheckingMode = "standard"
reportMissingImports = false # Ignore missing stubs in imported modules

[tool.pytest.ini_options]
# Run pytest with all our checkers, and don't spam us with massive tracebacks on error
addopts = """
    --tb=native -vv
    """
# https://iscinumpy.gitlab.io/post/bound-version-constraints/#watch-for-warnings
filterwarnings = "error"
# Doctest python code in docs, python code in src docstrings, test functions in tests
testpaths = "docs src tests"

[tool.coverage.run]
patch = ["subprocess"]
data_file = "/tmp/dls_va_ioc_sim.coverage"

[tool.coverage.paths]
# Tests are run from installed location, map back to the src directory
source = ["src", "**/site-packages/"]

[tool.tox]
skipsdist = true
# envs to runs automatically with tox -p
env_list = ["pre-commit", "type-checking", "tests"]

[tool.tox.env_run_base]
# Pass all environment variables to the test environments
passenv = ["*"]

[tool.tox.env.pre-commit]
description = "Run pre-commit on all files"
commands = [
    [
        "pre-commit",
        "run",
        "--all-files",
        "--show-diff-on-failure",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.type-checking]
description = "Run pyright"
commands = [
    [
        "pyright",
        "--pythonpath",
        "{env:VIRTUAL_ENV}/bin/python",
        "src",
        "tests",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.tox.env.tests]
description = "Run tests with coverage"
commands = [
    [
        "pytest",
        "--cov=dls_va_ioc_sim",
        "--cov-report",
        "term",
        "--cov-report",
        "xml:cov.xml",
        { replace = "posargs", default = [
        ], extend = true },
    ],
]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
# examples/ holds instances, not source: two written by hand to be read, and
# the shape of what `dls-va-ioc-sim generate` writes.  A generated instance
# carries the parse report as a comment block, absolute XML paths and all, so
# it cannot satisfy E501 however the generator is written - and reformatting
# one to suit a linter would misrepresent what the tool actually produces.
extend-exclude = ["examples"]
lint.select = [
    "B",   # flake8-bugbear - https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "C4",  # flake8-comprehensions - https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "E",   # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
    "F",   # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
    "N",   # pep8-naming - https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "W",   # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
    "I",   # isort - https://docs.astral.sh/ruff/rules/#isort-i
    "UP",  # pyupgrade - https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "SLF", # self - https://docs.astral.sh/ruff/settings/#lintflake8-self
]

lint.ignore = [
    # The device classes are named after the DLS support-module template each
    # one mirrors - ionPumpRecord for digitelMpcIonp, spaceRecord for
    # space.template - and are composed the way iocbuilder's own classes are,
    # which is lowerCamelCase throughout.  That mapping is the specification
    # when a device is added or edited, so it is worth more than the naming
    # convention; renaming to CapWords would break the one thing that ties
    # this code to the templates it imitates.
    "N801", # class names should use CapWords
    "N802", # function names should be lowercase
    "N803", # argument names should be lowercase
    "N806", # variables in functions should be lowercase
    # A generated instance names its variables after the PV they build -
    # SR03A-VA-GIONP-01 becomes gionpA01 - so that a device can be found in the
    # file by eye from its PV name.  Every instance is full of them.
    "N816", # variables in global scope should not be mixedCase
]

[tool.ruff.format]
# The device modules were written with hand-aligned continuation lines - the
# builder calls line their fields up under the record name, which is what makes
# a 1300 line file of records readable.  The formatter would rewrap all 3038 of
# them for no gain, and the diff would bury any real change made at the same
# time.  Everything ruff *checks* is clean on these files; only the reformat is
# off.  New modules are not on this list and are formatted normally.
exclude = [
    "src/dls_va_ioc_sim/builder_xml.py",
    "src/dls_va_ioc_sim/device_groups.py",
    "src/dls_va_ioc_sim/fe_seq_records.py",
    "src/dls_va_ioc_sim/gauge_records.py",
    "src/dls_va_ioc_sim/generate_ioc.py",
    "src/dls_va_ioc_sim/ion_pump_records.py",
    "src/dls_va_ioc_sim/parsed_ioc.py",
    "src/dls_va_ioc_sim/vacuum_model.py",
    "src/dls_va_ioc_sim/vacuum_sim.py",
    "src/dls_va_ioc_sim/vacuum_space_records.py",
]

[tool.ruff.lint.per-file-ignores]
# By default, private member access is allowed in tests
# See https://github.com/DiamondLightSource/python-copier-template/issues/154
# Remove this line to forbid private member access in tests
"tests/**/*" = ["SLF001"]
